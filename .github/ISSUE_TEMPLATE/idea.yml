name: Idea
description: Propose something to try. Search open issues first; if it exists, comment there instead.
title: "[idea] <area>: <short title>"
labels: ["type:idea"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [retrieval, temporal, verify, integration, analysis]
    validations: {required: true}
  - type: textarea
    id: hypothesis
    attributes:
      label: Hypothesis
      description: What change, and why it should help.
    validations: {required: true}
  - type: input
    id: target
    attributes:
      label: Question type and metric it should move
      placeholder: "multi-session, gold sessions in evidence 0.79 -> 0.85"
    validations: {required: true}
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Dev examples, a finding, a paper. Question ids are fine; no gold answers copied into code.
  - type: dropdown
    id: cost
    attributes:
      label: Cost
      options: ["< 1 h", "1-3 h", "> 3 h", "needs Reactor time"]
  - type: input
    id: by
    attributes:
      label: Proposed by (agent id or person)
