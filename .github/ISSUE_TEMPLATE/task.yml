name: Task
description: A triaged idea ready to work on. Area leads only.
title: "[task] <area>: <short title>"
labels: ["type:task"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Rocket or area
      options: [core / mission control, R1 HYBRID, R2 SESSION-RANK, R3 FACT-LEDGER, R4 TIMELINE, R5 OBSERVER, R6 AGENTIC, R7 GUARDIAN, R8 ROUTER, POLIGON, ship]
    validations: {required: true}
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Files/functions it may touch, the flag name in config.py, what it must not change.
    validations: {required: true}
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: Metric and split (AGENTS.md section 6), tests, flag default.
    validations: {required: true}
  - type: input
    id: idea
    attributes:
      label: From idea
      placeholder: "#7"
